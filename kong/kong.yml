_format_version: "3.0"

services:

  # ========================================
  # AUTH SERVICE
  # ========================================

  - name: auth-service
    url: http://auth-nginx:80

    routes:
      - name: auth-api
        paths:
          - /api/auth
        protocols:
          - http
        strip_path: false

    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:5173
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Requested-With
          exposed_headers:
            - Content-Length
          credentials: false
          max_age: 3600


